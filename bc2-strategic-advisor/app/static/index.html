<title>BC2 · Strategic Advisor — Gate 1</title>
<!--
  ===========================================================================
  BC2 · Gate-1-Oberfläche — Fassung D (Ticket #243, entschieden in #167)
  ===========================================================================

  Eine Datei, kein Rahmenwerk, kein Bauschritt, über StaticFiles aus FastAPI.
  Die Technikentscheidung fiel in #167 Frage 8 am Vergleich mit BC0s PWA: die
  ist ebenfalls eine Datei und trägt den ganzen Onboarding-Ablauf. HTMX oder
  ein SPA lösten hier ein Problem, das nicht vorliegt.

  **Nicht der Prototyp.** Der lag auf `prototyp/167-frontend-schnitt` und wurde
  ausdrücklich nicht befördert: keine Tests, keine Fehlerbehandlung, Daten aus
  einer eingebetteten `daten.js`, Zustand im localStorage. Was von ihm bleibt,
  ist der Schnitt — was neu ist, steht unten unter „Gegenüber dem Prototyp".

  Was diese Fassung behauptet (aus #167):

    1. Einstieg ist die LISTE DER LÄUFE, keine Profilwahl. BC0 stößt an (#165),
       der Lauf ist das Paket (ADR-005). Jede Abfrage filtert nach company_id.
    2. Gliederung nach KERNPROZESS als Akkordeon über einer Liste — der
       Kernprozess ist die Einheit, in der das Konzept an BC3 geht.
    3. Die MATRIX ist ein Knopf, keine zweite Seite. Sie zeigt die Lage, die
       Liste trägt die Reihenfolge; ein Quadrant kann keine Folge ausdrücken.
    4. ZIEHEN AUF ZWEI EBENEN — Zeile im Kernprozess, Kernprozess über seinen
       Kopf. Quer über Prozessgrenzen gesperrt: das wäre Umhängen, keine
       Reihenfolgefrage, und am Gate 1 nicht vorgesehen.
    5. Der VORSCHLAG IST VORBELEGT (alles freigegeben). Begründet wird die
       Abweichung, nicht die Zustimmung.
    6. JEDE NICHT-FREIGABE BRAUCHT EINE BEGRÜNDUNG, sonst bleibt Gate 1 zu.
    7. FEHLENDE DATEN: Etikett statt Zahl, nie eine 0.
    8. PRÄSENTATION ALS DOWNLOAD, nicht als Anzeige.

  Gegenüber dem Prototyp neu:

    - Die Daten kommen vom Server (/api/oberflaeche/…), nicht aus einer Datei.
    - Die Entscheidung geht an den Server und wird DORT geprüft. Im Prototyp
      war die Begründungspflicht ein ausgegrauter Knopf — also eine Bitte.
    - ↑/↓ neben dem Ziehen. Ziehen ist Maus-Bedienung; auf einem Tablet ginge
      es nicht. Ausdrückliche Auflage aus #167.
    - Fehlerbehandlung: jeder Ruf kann scheitern, und die Seite sagt das.

  Drei Dinge, die die Seite ehrlich ansagt statt sie zu verstecken:

    - Die Entscheidung liegt im ARBEITSSPEICHER des Dienstes. Schema `bc2` hat
      dafür noch keinen Ort (Nebel der Karte #158, eigenes Ticket).
    - Die Läufe stammen aus einem MESSSATZ, nicht aus der Datenbank. Die
      Erkennungsschnitt ist in #194 entschieden, aber noch nicht gebaut (#248); die
      Zahlen sind darum nicht auf stand_zum(uebergeben_am) gerechnet und nicht
      nachrechenbar.
    - Der DOWNLOAD DER PRÄSENTATION fehlt: Format und Erzeugungsweg sind #244.
-->
<style>

<body>

<div class="topbar">
  <span class="logo">BC2 · Strategic Advisor</span>
  <span class="sub">Gate 1 — Priorisierung freigeben</span>
  <div class="rechts">
    <label for="laufwahl">Lauf</label>
    <select id="laufwahl"></select>
    <button class="btn sec sm" id="abmelden" title="Schlüssel verwerfen">abmelden</button>
  </div>
</div>

<div id="meldung"></div>
<div id="laufkopf"></div>
<div id="buehne" class="laden">wird geladen …</div>

<script>
"use strict";

// ===========================================================================
// Schlüssel
// ===========================================================================
//
// BC2 hat keine Nutzerverwaltung (siehe oberflaeche.py). Die Seite weist sich
// mit demselben Bearer-Schlüssel aus wie BC0s Ruf. Er liegt im sessionStorage
// und nicht im localStorage: ein geschlossener Tab soll ihn vergessen.
//
// Daraus folgt: der Dienst weiß nicht, WER entscheidet. `entscheider` ist eine
// Selbstauskunft. Für ein Studienprojekt vertretbar, für einen echten
// Gate-1-Beschluss nicht.

const SCHLUESSEL_FACH = "bc2-gate1-schluessel";
let schluessel = sessionStorage.getItem(SCHLUESSEL_FACH) || "";

async function ruf(pfad, optionen = {}){
  const antwort = await fetch(pfad, {
    ...optionen,
    headers: {
      "Authorization": "Bearer " + schluessel,
      ...(optionen.body ? {"Content-Type": "application/json"} : {}),
      ...(optionen.headers || {}),
    },
  });
  let rumpf = null;
  try { rumpf = await antwort.json(); } catch { /* leerer Rumpf ist erlaubt */ }
  return {ok: antwort.ok, status: antwort.status, rumpf};
}

// ===========================================================================
// Zustand
// ===========================================================================
//
// Ein Objekt, kein Speicher über die Sitzung hinaus: der Stand der Entscheidung
// gehört dem Server. Was hier liegt, ist der UNGESPEICHERTE Zwischenstand —
// und die Seite sagt an, wenn er von dem abweicht, was der Server kennt.

const Z = {
  laeufe: [],
  paket_id: null,
  ansicht: null,          // die geladene Laufansicht
  gate1: null,            // der Stand, den der Server kennt
  freigegeben: new Set(),
  ablehnungsgrund: {},    // potenzial_id -> Text
  reihenfolge: null,      // gesetzte Potenzialfolge INNERHALB der Kernprozesse
  prozessfolge: null,     // gesetzte Kernprozessfolge
  abweichungsgrund: "",
  entscheider: "",
  gewaehlt: null,
  sicht: "liste",         // liste | matrix
  offen: new Set(),       // aufgeklappte Kernprozesse
  fluechtig: true,
  geaendert: false,       // seit dem letzten Speichern angefasst?
  meldung: null,
};

function esc(s){
  return String(s ?? "").replace(/[&<>"']/g, z =>
    ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[z]));
}
function eur(n){ return new Intl.NumberFormat("de-DE").format(Math.round(n)) + " €"; }
function zahl(n, stellen = 1){
  return new Intl.NumberFormat("de-DE", {maximumFractionDigits: stellen}).format(n);
}

// ===========================================================================
// Reihenfolge
// ===========================================================================
//
// Zwei Ebenen, wie in #167 entschieden. Die GELTENDE Folge ist die Verkettung:
// erst die Kernprozesse in ihrer (ggf. gezogenen) Folge, darin die Potenziale
// in ihrer. Quer über Prozessgrenzen wird nicht sortiert — das wäre Umhängen.
//
// Der gerechnete Rang bleibt daneben stehen. Beide reisen in die Lieferung:
// `potenzialrang` ist der Vorschlag, `gate1.finale_reihenfolge_potenzial_ids`
// die gesetzte Folge (Vertrag v3.0, Auflage aus #167).

function prozessOrdnung(){
  return Z.prozessfolge || Z.ansicht.prozess_raenge.map(r => r.kp_id);
}

function potenzialeVon(kp_id){
  const alle = Z.ansicht.eintraege.filter(e => e.kp_id === kp_id);
  if (!Z.reihenfolge) return alle;
  const rang = new Map(Z.reihenfolge.map((id, i) => [id, i]));
  return [...alle].sort((a, b) =>
    (rang.get(a.potenzial_id) ?? 1e9) - (rang.get(b.potenzial_id) ?? 1e9));
}

/** Die geltende Folge über den ganzen Lauf — Verkettung beider Ebenen. */
function geltendeFolge(){
  return prozessOrdnung().flatMap(kp => potenzialeVon(kp));
}

function gerechneteFolge(){
  return Z.ansicht.eintraege.map(e => e.potenzial_id);
}
function gerechneteProzessfolge(){
  return Z.ansicht.prozess_raenge.map(r => r.kp_id);
}

/**
 * Hat der MENSCH umsortiert?
 *
 * Nicht: weicht die angezeigte Folge vom gerechneten Rang ab. Das tut sie
 * nämlich immer — und zwar allein durch die Gliederung. Der Potenzialrang
 * läuft nach ADR-006 · BC2 strikt nach Score über den ganzen Lauf; sobald
 * nach Kernprozess gruppiert wird, steht jedes Potenzial eines vorderen
 * Prozesses über allen Potenzialen der übrigen. Das ist Befund 2 aus #167,
 * und es ist der Preis der Gliederung, nicht eine Entscheidung des Menschen.
 *
 * Würde hier die angezeigte gegen die gerechnete Folge verglichen, verlangte
 * die Seite schon beim ersten Laden eine Begründung — für etwas, das niemand
 * getan hat. Genau die Zumutung, die die Vorbelegung vermeiden soll.
 *
 * Verglichen wird deshalb gegen die AUSGANGSGLIEDERUNG — die Folge, die die
 * Seite ohne jeden Eingriff zeigt. Wer etwas verschiebt und wieder
 * zurückschiebt, schuldet damit auch keine Begründung.
 */
function ausgangsGliederung(){
  return gerechneteProzessfolge().flatMap(kp =>
    Z.ansicht.eintraege.filter(e => e.kp_id === kp).map(e => e.potenzial_id));
}

function wurdeUmsortiert(){
  if (Z.reihenfolge === null && Z.prozessfolge === null) return false;
  const folge = geltendeFolge().map(p => p.potenzial_id);
  return JSON.stringify(folge) !== JSON.stringify(ausgangsGliederung())
      || JSON.stringify(prozessOrdnung()) !== JSON.stringify(gerechneteProzessfolge());
}

/** Verschiebt ein Potenzial innerhalb SEINES Kernprozesses. */
function verschiebePotenzial(potenzial_id, richtung){
  const eintrag = Z.ansicht.eintraege.find(e => e.potenzial_id === potenzial_id);
  const geschwister = potenzialeVon(eintrag.kp_id).map(e => e.potenzial_id);
  const i = geschwister.indexOf(potenzial_id), j = i + richtung;
  if (j < 0 || j >= geschwister.length) return;
  [geschwister[i], geschwister[j]] = [geschwister[j], geschwister[i]];
  setzePotenzialfolge(eintrag.kp_id, geschwister);
}

/** Schreibt die neue Folge eines Kernprozesses in die Gesamtfolge zurück. */
function setzePotenzialfolge(kp_id, neue_ids){
  const bisher = Z.reihenfolge || gerechneteFolge();
  const fremde = bisher.filter(id =>
    Z.ansicht.eintraege.find(e => e.potenzial_id === id).kp_id !== kp_id);
  // Die Gesamtfolge wird aus den Kernprozessen neu zusammengesetzt, damit sie
  // eine Permutation bleibt — der Server prüft genau das.
  const nachKp = new Map();
  for (const id of [...fremde, ...neue_ids]){
    const kp = Z.ansicht.eintraege.find(e => e.potenzial_id === id).kp_id;
    if (!nachKp.has(kp)) nachKp.set(kp, []);
    nachKp.get(kp).push(id);
  }
  nachKp.set(kp_id, neue_ids);
  Z.reihenfolge = prozessOrdnung().flatMap(kp => nachKp.get(kp) || []);
  Z.geaendert = true;
}

function verschiebeProzess(kp_id, richtung){
  const folge = [...prozessOrdnung()];
  const i = folge.indexOf(kp_id), j = i + richtung;
  if (j < 0 || j >= folge.length) return;
  [folge[i], folge[j]] = [folge[j], folge[i]];
  Z.prozessfolge = folge;
  Z.reihenfolge = folge.flatMap(kp => potenzialeVon(kp).map(e => e.potenzial_id));
  Z.geaendert = true;
}

// ===========================================================================
// Freigabe
// ===========================================================================

/** Alles freigegeben, alle Kernprozesse offen — der Vorschlag als Ausgangspunkt. */
function vorbelegen(){
  Z.freigegeben = new Set(Z.ansicht.eintraege.map(e => e.potenzial_id));
  Z.offen = new Set(Z.ansicht.prozess_raenge.map(r => r.kp_id));
  Z.ablehnungsgrund = {};
  Z.reihenfolge = null; Z.prozessfolge = null;
  Z.abweichungsgrund = ""; Z.geaendert = false;
}

/** Übernimmt einen bereits gespeicherten Gate-1-Stand vom Server. */
function ausGate1(g){
  vorbelegen();
  if (!g || g.status === "pending") return;
  if (g.approved_potenzial_ids) Z.freigegeben = new Set(g.approved_potenzial_ids);
  for (const n of g.nicht_freigegeben || []){
    Z.freigegeben.delete(n.potenzial_id);
    Z.ablehnungsgrund[n.potenzial_id] = n.begruendung;
  }
  if (g.finale_reihenfolge_potenzial_ids) Z.reihenfolge = g.finale_reihenfolge_potenzial_ids;
  if (g.finale_prozessreihenfolge_kp_ids) Z.prozessfolge = g.finale_prozessreihenfolge_kp_ids;
  Z.abweichungsgrund = g.abweichungsbegruendung || "";
  Z.entscheider = g.entscheider || Z.entscheider;
  Z.geaendert = false;
}

/** Die Potenziale, die herausgenommen wurden, ohne dass ein Grund dasteht. */
function ohneBegruendung(){
  return Z.ansicht.eintraege
    .filter(e => !Z.freigegeben.has(e.potenzial_id))
    .filter(e => (Z.ablehnungsgrund[e.potenzial_id] || "").trim().length < 5)
    .map(e => e.potenzial_id);
}

/**
 * Eine Spanne, nie ein Punktwert (#167 Frage 3). Gerundet auf T€, die Breite
 * als ±-Angabe daneben. `null` heißt: keine Value-Zahl — dann ein Etikett und
 * ein schraffierter Balken, NIE eine 0 (#167 Frage 6).
 */
function spanneKurz(s){
  if (!s) return `<span class="tag fehlt">keine Value-Zahl</span>`;
  const mitte = (s.min + s.max) / 2;
  const breite = mitte ? Math.round(100 * (s.max - s.min) / (2 * mitte)) : 0;
  const t = v => v >= 10000 ? zahl(v / 1000, 0) + " T€" : eur(v);
  return `<span class="spanne"><span class="zahl">${t(s.min)}–${t(s.max)}</span>`
       + `<span class="breite">±${breite} %</span></span>`;
}

function bandHtml(s, maximum){
  if (!s) return `<div class="band keine" title="keine Value-Zahl"></div>`;
  const links = 100 * s.min / maximum, rechts = 100 * s.max / maximum;
  return `<div class="band"><div class="fuellung" style="left:${links}%;`
       + `width:${Math.max(rechts - links, 1.5)}%"></div></div>`;
}

// ===========================================================================
// Matrix — Anzeige, kein Bedienelement
// ===========================================================================
//
// #167 Fund 4: bei zwei ganzzahligen Achsen von 1 bis 10 liegen Potenziale
// regelmäßig exakt übereinander und verdecken sich. Der Prototyp ließ den Fall
// sichtbar stehen. Hier bekommen gleiche Koordinaten einen kleinen Versatz auf
// einem Kreis — die Lage bleibt ablesbar, und kein Punkt verschwindet.

function matrixSvg(){
  const B = {l:56, r:22, o:22, u:44}, W = 760, H = 430;
  const iW = W - B.l - B.r, iH = H - B.o - B.u;
  const x = k => B.l + (k - 0.5) / 10 * iW;          // Komplexität 1..10
  const y = i => B.o + iH - (i - 0.5) / 10 * iH;     // Impact 1..10

  const mit = Z.ansicht.eintraege.filter(e => e.einsparung_eur_jahr);
  const maxE = Math.max(1, ...mit.map(e => e.einsparung_eur_jahr.max));

  // Gleiche Koordinate -> Versatz auf einem kleinen Kreis.
  const belegt = new Map();
  const versatz = e => {
    const schluessel = e.impact + ":" + e.umsetzungskomplexitaet;
    const n = belegt.get(schluessel) || 0;
    belegt.set(schluessel, n + 1);
    if (!n) return [0, 0];
    const winkel = (n - 1) * (2 * Math.PI / 6);
    return [Math.cos(winkel) * 13, Math.sin(winkel) * 13];
  };

  const raster = [];
  for (let k = 1; k <= 10; k++){
    raster.push(`<line x1="${x(k)}" y1="${B.o}" x2="${x(k)}" y2="${B.o + iH}"
                  stroke="#f0f2f5"/>`);
    raster.push(`<text x="${x(k)}" y="${B.o + iH + 16}" text-anchor="middle"
                  font-size="10" fill="#9aa4b1">${k}</text>`);
  }
  for (let i = 1; i <= 10; i++){
    raster.push(`<line x1="${B.l}" y1="${y(i)}" x2="${B.l + iW}" y2="${y(i)}"
                  stroke="#f0f2f5"/>`);
    raster.push(`<text x="${B.l - 9}" y="${y(i) + 3.5}" text-anchor="end"
                  font-size="10" fill="#9aa4b1">${i}</text>`);
  }

  const punkte = Z.ansicht.eintraege.map(e => {
    const [dx, dy] = versatz(e);
    // Ohne Value-Zahl behält der Punkt seine Lage, bekommt aber den
    // Mindestradius: eine Fläche zu zeichnen, die es nicht gibt, wäre die
    // Scheingenauigkeit, die die Bandbreite gerade vermeiden soll (#167).
    const r = e.einsparung_eur_jahr
      ? 6 + 12 * Math.sqrt(e.einsparung_eur_jahr.max / maxE)
      : 5;
    const farbe = {"PRIO 1":"#1f9d57","PRIO 2":"#d98c1f","PRIO 3":"#8a94a6"}[e.prioritaetsgruppe];
    const abgelehnt = !Z.freigegeben.has(e.potenzial_id);
    return `<g class="punkt ${Z.gewaehlt === e.potenzial_id ? "gewaehlt" : ""}"
              data-id="${esc(e.potenzial_id)}">
      <title>${esc(e.titel)} — Impact ${e.impact}, Komplexität ${e.umsetzungskomplexitaet}${
        e.einsparung_eur_jahr ? "" : " (keine Value-Zahl)"}</title>
      <circle cx="${x(e.umsetzungskomplexitaet) + dx}" cy="${y(e.impact) + dy}" r="${r}"
        fill="${farbe}" fill-opacity="${abgelehnt ? .2 : .55}" stroke="${farbe}"
        stroke-dasharray="${e.einsparung_eur_jahr ? "" : "3 2"}"/>
      <text x="${x(e.umsetzungskomplexitaet) + dx}" y="${y(e.impact) + dy + 3.5}"
        text-anchor="middle" font-size="10" font-weight="700"
        fill="${abgelehnt ? "#98a2b0" : "#16324f"}">${e.potenzialrang}</text></g>`;
  }).join("");

  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Impact über Komplexität">
    <rect x="${B.l}" y="${B.o}" width="${iW}" height="${iH}" fill="#fcfdfe" stroke="#e6eaef"/>
    ${raster.join("")}
    <line x1="${B.l}" y1="${y(5.5)}" x2="${B.l + iW}" y2="${y(5.5)}" stroke="#dbe1e8"
      stroke-dasharray="4 3"/>
    <line x1="${x(5.5)}" y1="${B.o}" x2="${x(5.5)}" y2="${B.o + iH}" stroke="#dbe1e8"
      stroke-dasharray="4 3"/>
    <text x="${B.l + 8}" y="${B.o + 16}" font-size="11" font-weight="700"
      fill="#1f9d57">Quick Win</text>
    <text x="${B.l + iW - 8}" y="${B.o + 16}" font-size="11" font-weight="700"
      fill="#3B6EA5" text-anchor="end">Strategisch</text>
    <text x="${B.l + 8}" y="${B.o + iH - 8}" font-size="11" font-weight="700"
      fill="#6b7280">Optional</text>
    <text x="${B.l + iW - 8}" y="${B.o + iH - 8}" font-size="11" font-weight="700"
      fill="#8d4a58" text-anchor="end">Zurückgestellt</text>
    ${punkte}
    <text x="${B.l + iW / 2}" y="${H - 8}" text-anchor="middle" font-size="11"
      fill="#6b7280">Umsetzungskomplexität →</text>
    <text x="14" y="${B.o + iH / 2}" text-anchor="middle" font-size="11" fill="#6b7280"
      transform="rotate(-90 14 ${B.o + iH / 2})">Impact →</text>
  </svg>`;
}

/**
 * `position` ist die Stelle in der geltenden Folge; sie wird nur geführt,
 * wenn der Mensch umsortiert hat. Solange er das nicht tat, gilt der
 * **gerechnete** Rang — und dann muss die Zeile den zeigen und nicht ihre
 * Stelle in der Gliederung. Sonst sähe der Mensch eine dritte Ordnung, die
 * weder gerechnet noch gesetzt ist, und gäbe sie frei.
 */
function zeichneZeile(e, position){
  const id = e.potenzial_id;
  const abgelehnt = !Z.freigegeben.has(id);
  const grund = Z.ablehnungsgrund[id] || "";
  const geschwister = potenzialeVon(e.kp_id).map(x => x.potenzial_id);
  const i = geschwister.indexOf(id);
  const gesetzt = wurdeUmsortiert();

  return `
  <div class="dzeile ${abgelehnt ? "abgelehnt" : ""} ${Z.gewaehlt === id ? "gewaehlt" : ""}"
       draggable="true" data-zieh="${esc(id)}" data-kp="${esc(e.kp_id)}">
    <span class="griff" title="ziehen zum Umsortieren">⠿</span>
    <span class="pfeile">
      <button data-hoch="${esc(id)}" ${i === 0 ? "disabled" : ""}
        title="im Kernprozess nach oben" aria-label="nach oben">▲</button>
      <button data-runter="${esc(id)}" ${i === geschwister.length - 1 ? "disabled" : ""}
        title="im Kernprozess nach unten" aria-label="nach unten">▼</button>
    </span>
    <span class="pos" title="${gesetzt ? "gesetzte Stelle" : "gerechneter Rang"}">${
      gesetzt ? position : e.potenzialrang}</span>
    <span class="titel" data-id="${esc(id)}">
      <b>${esc(e.titel)}</b>
      <span class="unten"><code>${esc(e.betroffene_teilprozess_ids.join(", "))}</code> ·
        Score ${e.score}${gesetzt ? ` · <b>Vorschlag Rang ${e.potenzialrang}</b>` : ""}</span>
    </span>
    <span class="wert" data-id="${esc(id)}">${spanneKurz(e.einsparung_eur_jahr)}</span>
    <span class="achsen" data-id="${esc(id)}">I <b>${e.impact}</b> ·
      K <b>${e.umsetzungskomplexitaet}</b></span>
    <span class="tag ${KAT[e.kategorie]}">${e.kategorie}</span>
    <span class="tag ${GRP[e.prioritaetsgruppe]}">${e.prioritaetsgruppe}</span>
    <label class="frei"><input type="checkbox" data-frei="${esc(id)}"
      ${abgelehnt ? "" : "checked"}> freigeben</label>
  </div>
  ${abgelehnt ? `
    <div class="grundfeld ${grund.trim().length >= 5 ? "" : "fehlt"}">
      <label>Warum geht <b>${esc(e.titel)}</b> nicht mit?
        ${grund.trim().length >= 5 ? "" : `<span class="tag fehlt">Pflicht</span>`}</label>
      <textarea data-ablehnung="${esc(id)}" placeholder="Die Rechnung schlägt es vor — was spricht dagegen? (Querschnitt, Abhängigkeit, Zeitpunkt …)">${esc(grund)}</textarea>
    </div>` : ""}`;
}

function zeichneListe(){
  const folge = geltendeFolge();
  const ordnung = prozessOrdnung();

  return ordnung.map((kp_id, idx) => {
    const rang = Z.ansicht.prozess_raenge.find(r => r.kp_id === kp_id);
    const eigene = potenzialeVon(kp_id);
    const frei = eigene.filter(e => Z.freigegeben.has(e.potenzial_id)).length;
    const mitValue = eigene.filter(e => e.einsparung_eur_jahr);
    const summe = mitValue.reduce(
      (s, e) => s + (e.einsparung_eur_jahr.min + e.einsparung_eur_jahr.max) / 2, 0);
    const verschoben = rang.prozessrang !== idx + 1;
    const name = Z.ansicht.kp_namen[kp_id];

    return `
    <details class="kpblock" data-kp-block="${esc(kp_id)}" ${Z.offen.has(kp_id) ? "open" : ""}>
      <summary draggable="true" data-ziehkp="${esc(kp_id)}">
        <span class="griff" title="ganzen Kernprozess ziehen">⠿</span>
        <span class="pfeile">
          <button data-kphoch="${esc(kp_id)}" ${idx === 0 ? "disabled" : ""}
            title="Kernprozess nach oben" aria-label="Kernprozess nach oben">▲</button>
          <button data-kprunter="${esc(kp_id)}" ${idx === ordnung.length - 1 ? "disabled" : ""}
            title="Kernprozess nach unten" aria-label="Kernprozess nach unten">▼</button>
        </span>
        <span class="pos">${idx + 1}</span>
        <b><code>${esc(kp_id)}</code>${name ? " · " + esc(name) : ""}</b>
        ${verschoben ? `<span class="tag p2">Vorschlag: ${rang.prozessrang}</span>` : ""}

        <span style="margin-left:auto;color:var(--muted);font-size:12.5px">${
          mitValue.length
            ? "≈ " + eur(summe) + "/Jahr" + (mitValue.length < eigene.length

        ${eigene.map(e => zeichneZeile(e, folge.indexOf(e) + 1)).join("")}
      </div>
    </details>`;
  }).join("");
}

      <b>Die Reihenfolge weicht vom gerechneten Rang ab.</b> Der Vorschlag bleibt daneben
      sichtbar; die Lieferung trägt beides. Eine Begründung gehört an den Lauf.
      <div style="margin-top:8px">
        <textarea data-abweichung="1" style="width:100%;min-height:52px;border:1px solid
          var(--line);border-radius:7px;padding:8px 10px;font-family:inherit;font-size:13px"
          placeholder="Warum weicht die Reihenfolge ab? (Pflicht, mindestens 5 Zeichen)"
          >${esc(Z.abweichungsgrund)}</textarea>
      </div>
    </div>` : "";

  const inhalt = Z.sicht === "matrix"
    ? `<div class="matrixkarte">${matrixSvg()}</div>
       <p class="hinweis info" style="margin-top:14px">Die Matrix ist <b>Anzeige</b>.
         Umsortiert und freigegeben wird in der Liste — eine Reihenfolge lässt sich in einem
         Quadranten nicht ausdrücken. Punkte auf derselben Koordinate werden leicht versetzt,
         damit keiner verdeckt wird.</p>`
    : zeichneListe();

  ziel.innerHTML = `
    ${notiz()}
    <div class="wrap">
      ${warnungen.join("")}
      ${kopfzeile}
      ${abweichung}
      ${inhalt}
    </div>
    ${Z.gewaehlt ? `<div class="schublade">
      <button class="btn sec sm" data-zu="1" style="float:right">schließen</button>
      ${detailHtml(Z.gewaehlt)}</div>` : ""}
    ${fussleiste(offen)}`;
}

function fussleiste(offen){
  const frei = Z.freigegeben.size;
  const gesamt = Z.ansicht.eintraege.length;
  const fehltAbweichung = wurdeUmsortiert() && Z.abweichungsgrund.trim().length < 5;

  return `<div class="fussleiste">
    <b>${frei} von ${gesamt}</b> freigegeben
    ${offen.length
      ? `<span class="tag fehlt">${offen.length} Begründung(en) fehlen</span>`
      : `<span style="color:var(--ok)">✓ vollständig begründet</span>`}
    ${fehltAbweichung ? `<span class="tag fehlt">Abweichung unbegründet</span>` : ""}
    ${Z.geaendert ? `<span class="tag p2">nicht gespeichert</span>` : ""}
    <label style="color:var(--muted);font-size:12.5px;display:flex;align-items:center;gap:6px">
      Entscheider
      <input data-entscheider="1" value="${esc(Z.entscheider)}" placeholder="Name"
        style="border:1px solid var(--line);border-radius:7px;padding:5px 9px;
               font-family:inherit;font-size:12.5px;width:150px"></label>
    <span style="margin-left:auto"></span>
    <button class="btn sec" data-tat="rejected">ganzen Lauf ablehnen</button>
    <button class="btn" ${darfFreigeben() ? "" : "disabled"} data-tat="approved">
      Gate 1 freigeben</button>
  </div>`;
}

function notiz(){
  return `<details class="notiz"><summary>Was diese Oberfläche behauptet</summary><ol>
    <li><b>Der Einstieg ist die Liste der Läufe</b>, keine Profilwahl: BC0 stößt an (#165),
      und der Lauf ist das Paket (ADR-005 · BC2). Nicht bewertete oder nicht freigegebene
      Prozesse kommen gar nicht vor — Gate 0 lässt sie nicht durch.</li>
    <li><b>Gliederung nach Kernprozess</b> als Akkordeon über einer Liste. Der Kernprozess ist
      die Einheit, in der das Konzept an BC3 geht; die Prioritätsgruppe ist ein Etikett in der
      Zeile, keine Gliederungsebene.</li>
    <li><b>Die Matrix ist ein Knopf</b>, keine zweite Seite: dieselben Daten, andere Frage.
      Sie bleibt Anzeige.</li>
    <li><b>Ziehen auf zwei Ebenen</b> — eine Zeile innerhalb ihres Kernprozesses, oder der
      ganze Kernprozess über seinen Kopf. Quer über Prozessgrenzen ist gesperrt: das wäre
      Umhängen, keine Reihenfolgefrage. <b>Zusätzlich ↑/↓</b>, weil Ziehen Maus-Bedienung ist.</li>
    <li><b>Die Gliederung ist nicht die Rangfolge.</b> Der Potenzialrang läuft nach ADR-006 · BC2
      strikt nach Score über den <i>ganzen</i> Lauf; die Liste gruppiert nach Kernprozess. Beides
      nebeneinander zu zeigen ist Absicht — solange niemand eingreift, führt die Zeile den
      <b>gerechneten</b> Rang, und genau der wird geliefert. Erst wenn umsortiert wurde, zeigt sie
      die gesetzte Stelle und den Vorschlag daneben, und die Lieferung trägt beide Listen.</li>
    <li><b>Der Vorschlag ist vorbelegt</b> — alles freigegeben. Begründet wird die
      <b>Abweichung</b>, nicht die Zustimmung.</li>
    <li><b>Jede Nicht-Freigabe braucht eine Begründung</b>, sonst bleibt Gate 1 zu. Die Prüfung
      läuft auf dem <b>Server</b>; dieser Knopf spiegelt sie nur, damit niemand bis zum
      Absenden warten muss.</li>
    <li><b>Fehlende Daten: Etikett statt Zahl, nie eine 0.</b> In der Matrix behält der Punkt
      seine Lage und bekommt den Mindestradius — eine Fläche zu zeichnen, die es nicht gibt,
      wäre genau die Scheingenauigkeit, die die Bandbreite vermeiden soll.</li>
    <li><b>Was Gate 1 nicht darf:</b> Annahmen ändern. Das wäre Rechnen von Hand und
      zerstörte die Reproduzierbarkeit. Umsortieren und Herausnehmen ja, Zahlen anfassen nein.</li>
    <li><b>Noch nicht da:</b> der Download der Präsentation (Format und Erzeugungsweg sind
      #244) und die Klartextnamen der Kernprozesse (#248).</li>
  </ol></details>`;
}

function zeichne(){
  zeichneMeldung();
  zeichneKopf();
  zeichneBuehne();
}

// ===========================================================================
// Laden und Speichern
// ===========================================================================

function zeigeTor(text){
  document.getElementById("laufkopf").innerHTML = "";
  document.getElementById("meldung").innerHTML = "";
  document.getElementById("buehne").className = "";
  document.getElementById("buehne").innerHTML = `<div class="tor">
    <h2>Schlüssel</h2>
    <p style="color:var(--muted);line-height:1.6">BC2 hat keine Nutzerverwaltung. Die
      Oberfläche weist sich mit demselben Schlüssel aus wie BC0s Ruf
      (<code>BC2_TRIGGER_TOKEN</code>). Er bleibt in diesem Tab und wird beim Schließen
      vergessen.</p>
    ${text ? `<p class="hinweis warn">${esc(text)}</p>` : ""}
    <input id="schluesselfeld" type="password" placeholder="Schlüssel"
      autocomplete="current-password">
    <button class="btn" id="anmelden">weiter</button>
  </div>`;
  document.getElementById("schluesselfeld").focus();
}

async function ladeListe(){
  const {ok, status, rumpf} = await ruf("/api/oberflaeche/laeufe");
  if (status === 401){ zeigeTor("Der Schlüssel stimmt nicht."); return false; }
  if (!ok){
    Z.meldung = {art: "warn", text: `Die Liste der Läufe ist nicht erreichbar (${status}).`};
    zeichne(); return false;
  }
  Z.laeufe = rumpf.laeufe;

  const wahl = document.getElementById("laufwahl");
  wahl.innerHTML = Z.laeufe.length
    ? Z.laeufe.map(l => `<option value="${esc(l.paket_id)}">${esc(l.paket_id)} ·
        ${l.anzahl_potenziale} Potenziale · ${
          {pending: "offen", approved: "freigegeben", rejected: "abgelehnt"}[l.gate1_status]
        }</option>`).join("")
    : `<option value="">— kein Lauf —</option>`;
  return true;
}

async function ladeLauf(paket_id){
  if (!paket_id){ Z.ansicht = null; zeichne(); return; }
  const {ok, status, rumpf} = await ruf("/api/oberflaeche/laeufe/" + encodeURIComponent(paket_id));
  if (!ok){
    Z.ansicht = null;
    Z.meldung = {art: "warn", text: `Lauf ${esc(paket_id)} konnte nicht geladen werden (${status}).`};
    zeichne(); return;
  }
  Z.paket_id = paket_id;
  Z.ansicht = rumpf;
  Z.gate1 = rumpf.gate1;
  Z.gewaehlt = null;
  Z.meldung = null;
  ausGate1(rumpf.gate1);
  zeichne();
}

/** Baut den Rumpf, den `POST …/gate1` erwartet — die Vertragsform v3.0. */
function alsEntscheidung(status){
  const folge = geltendeFolge().map(p => p.potenzial_id);
  const rumpf = {
    status,
    entscheider: Z.entscheider,
    approved_potenzial_ids: [...Z.freigegeben],
    nicht_freigegeben: Z.ansicht.eintraege
      .filter(e => !Z.freigegeben.has(e.potenzial_id))
      .map(e => ({potenzial_id: e.potenzial_id,
                  begruendung: (Z.ablehnungsgrund[e.potenzial_id] || "").trim()})),
  };
  if (wurdeUmsortiert()){
    rumpf.finale_reihenfolge_potenzial_ids = folge;
    rumpf.finale_prozessreihenfolge_kp_ids = prozessOrdnung();
    rumpf.abweichungsbegruendung = Z.abweichungsgrund.trim();
  }
  if (status === "rejected"){
    // Ein abgelehnter Lauf braucht EINE Begründung, nicht elf: der Server
    // verlangt bei 'rejected' den Kommentar und keine Einzelbegründungen.
    // Ausdrücklich NICHT die Abweichungsbegründung — die erklärt, warum die
    // Reihenfolge anders ist, nicht warum der Lauf nicht taugt.
    rumpf.kommentar = (prompt("Warum wird der ganze Lauf abgelehnt?") || "").trim();
    rumpf.approved_potenzial_ids = [];
    rumpf.nicht_freigegeben = [];
    delete rumpf.finale_reihenfolge_potenzial_ids;
    delete rumpf.finale_prozessreihenfolge_kp_ids;
    delete rumpf.abweichungsbegruendung;
  }
  return rumpf;
}

async function entscheiden(status){
  const rumpf = alsEntscheidung(status);
  if (status === "rejected" && rumpf.kommentar.length < 5){
    Z.meldung = {art: "warn",
      text: "Ohne Begründung wird nichts abgelehnt — mindestens fünf Zeichen."};
    return zeichne();
  }

  const antwort = await ruf(
    `/api/oberflaeche/laeufe/${encodeURIComponent(Z.paket_id)}/gate1`,
    {method: "POST", body: JSON.stringify(rumpf)});

  if (antwort.status === 422){
    Z.meldung = {art: "warn", text:
      `<b>Die Entscheidung ist so nicht zulässig.</b><ul style="margin:7px 0 0">`
      + (antwort.rumpf.maengel || []).map(m => `<li>${esc(m)}</li>`).join("")
      + `</ul>`};
    return zeichne();
  }
  if (!antwort.ok){
    Z.meldung = {art: "warn",
      text: `Speichern fehlgeschlagen (${antwort.status}). Die Entscheidung ist <b>nicht</b> abgelegt.`};
    return zeichne();
  }

  Z.gate1 = antwort.rumpf.gate1;
  Z.geaendert = false;
  Z.meldung = {art: "info", text: status === "approved"
    ? `<b>Gate 1 freigegeben.</b> ${Z.freigegeben.size} Potenzial(e) gehen an BC3.
       Die Präsentation als Download fehlt noch — Format und Erzeugungsweg sind
       <a href="https://github.com/pg-coe-kmu/coe-factory/issues/244">#244</a>.`
    : `<b>Lauf abgelehnt.</b> Es wird nichts ausgeliefert und nichts gelöscht; ein erneuter
       Lauf erzeugt Fassung ${Z.ansicht.kopf.fassung + 1}, diese bleibt abrufbar.`};
  await ladeListe();
  document.getElementById("laufwahl").value = Z.paket_id;
  zeichne();
}

// ===========================================================================
// Ereignisse
// ===========================================================================

document.addEventListener("click", async e => {
  const t = e.target;

  if (t.id === "anmelden"){
    schluessel = document.getElementById("schluesselfeld").value.trim();
    sessionStorage.setItem(SCHLUESSEL_FACH, schluessel);
    return starten();
  }
  if (t.id === "abmelden"){
    sessionStorage.removeItem(SCHLUESSEL_FACH); schluessel = "";
    return zeigeTor("");
  }
  if (!Z.ansicht) return;

  const hoch = t.closest("[data-hoch]"), runter = t.closest("[data-runter]");
  if (hoch || runter){
    verschiebePotenzial((hoch || runter).dataset[hoch ? "hoch" : "runter"], hoch ? -1 : 1);
    return zeichne();
  }
  const kphoch = t.closest("[data-kphoch]"), kprunter = t.closest("[data-kprunter]");
  if (kphoch || kprunter){
    e.preventDefault();  // sonst klappt das <details> beim Klick im <summary> um
    verschiebeProzess((kphoch || kprunter).dataset[kphoch ? "kphoch" : "kprunter"],
                      kphoch ? -1 : 1);
    return zeichne();
  }

  const sicht = t.closest("[data-sicht]");
  if (sicht){ Z.sicht = sicht.dataset.sicht; Z.gewaehlt = null; return zeichne(); }

  if (t.closest("[data-vorbelegen]")){
    if (confirm("Freigaben, Begründungen und Reihenfolge auf den Vorschlag zurücksetzen?")){
      vorbelegen(); zeichne();
    }
    return;
  }
  if (t.closest("[data-zu]")){ Z.gewaehlt = null; return zeichne(); }

  const tat = t.closest("[data-tat]");
  if (tat) return entscheiden(tat.dataset.tat);

  // Zuletzt, damit Knöpfe INNERHALB einer Zeile zuerst greifen.
  const ziel = t.closest("[data-id]");
  if (ziel && !t.closest("[data-frei]")){
    Z.gewaehlt = Z.gewaehlt === ziel.dataset.id ? null : ziel.dataset.id;
    return zeichne();
  }
});

document.addEventListener("change", async e => {
  if (e.target.id === "laufwahl") return ladeLauf(e.target.value);

  const frei = e.target.closest("[data-frei]");
  if (frei){
    const id = frei.dataset.frei;
    Z.freigegeben.has(id) ? Z.freigegeben.delete(id) : Z.freigegeben.add(id);
    Z.geaendert = true;
    return zeichne();
  }
});

document.addEventListener("input", e => {
  // Beim Tippen NICHT neu zeichnen — das nähme den Schreibfokus mitten im Satz.
  // Der Zustand wandert mit, die Seite holt beim nächsten Ereignis auf; nur die
  // Anzeigen, die an der Eingabe hängen, werden von Hand nachgeführt.
  const ablehnung = e.target.closest("[data-ablehnung]");
  if (ablehnung){
    Z.ablehnungsgrund[ablehnung.dataset.ablehnung] = e.target.value;
    Z.geaendert = true;
    const feld = ablehnung.closest(".grundfeld");
    if (feld) feld.classList.toggle("fehlt", e.target.value.trim().length < 5);
    return fussleisteNachfuehren();
  }
  const abweichung = e.target.closest("[data-abweichung]");
  if (abweichung){
    Z.abweichungsgrund = e.target.value; Z.geaendert = true;
    return fussleisteNachfuehren();
  }
  const entscheider = e.target.closest("[data-entscheider]");
  if (entscheider){ Z.entscheider = e.target.value; }
});

/** Führt die Fußleiste nach, ohne die Seite neu zu zeichnen. */
function fussleisteNachfuehren(){
  const leiste = document.querySelector(".fussleiste");
  if (!leiste || !Z.ansicht) return;
  const knopf = leiste.querySelector('[data-tat="approved"]');
  if (knopf) knopf.disabled = !darfFreigeben();
  const zaehler = leiste.querySelector(".tag.fehlt");
  const offen = ohneBegruendung();
  if (zaehler && offen.length) zaehler.textContent = `${offen.length} Begründung(en) fehlen`;
}

// --- Ziehen ----------------------------------------------------------------
//
// Zwei Ebenen, und quer über Prozessgrenzen gesperrt. Die Sperre ist keine
// Bequemlichkeit: ein Potenzial in einen anderen Kernprozess zu ziehen wäre
// UMHÄNGEN, und das ist am Gate 1 nicht vorgesehen — das Konzept geht je
// Kernprozess an BC3.

let gezogen = null;   // {art: "potenzial"|"prozess", id, kp}

document.addEventListener("dragstart", e => {
  const zeile = e.target.closest("[data-zieh]");
  const kopf = e.target.closest("[data-ziehkp]");
  if (zeile) gezogen = {art: "potenzial", id: zeile.dataset.zieh, kp: zeile.dataset.kp};
  else if (kopf) gezogen = {art: "prozess", id: kopf.dataset.ziehkp};
  else return;
  e.dataTransfer.effectAllowed = "move";
});

document.addEventListener("dragover", e => {
  if (!gezogen) return;
  const ziel = gezogen.art === "potenzial"
    ? e.target.closest("[data-zieh]")
    : e.target.closest("[data-ziehkp]");
  if (!ziel) return;
  // Fremder Kernprozess: kein gültiges Ziel. Kein dropEffect, kein Rahmen —
  // der Mauszeiger sagt dann von selbst, dass hier nichts abgelegt wird.
  if (gezogen.art === "potenzial" && ziel.dataset.kp !== gezogen.kp) return;
  e.preventDefault();
  document.querySelectorAll(".ziehziel").forEach(x => x.classList.remove("ziehziel"));
  ziel.classList.add("ziehziel");
});

document.addEventListener("drop", e => {
  if (!gezogen) return;
  document.querySelectorAll(".ziehziel").forEach(x => x.classList.remove("ziehziel"));

  if (gezogen.art === "potenzial"){
    const ziel = e.target.closest("[data-zieh]");
    if (!ziel || ziel.dataset.kp !== gezogen.kp){ gezogen = null; return; }
    e.preventDefault();
    const ids = potenzialeVon(gezogen.kp).map(x => x.potenzial_id);
    const von = ids.indexOf(gezogen.id), nach = ids.indexOf(ziel.dataset.zieh);
    if (von !== -1 && nach !== -1 && von !== nach){
      ids.splice(nach, 0, ids.splice(von, 1)[0]);
      setzePotenzialfolge(gezogen.kp, ids);
    }
  } else {
    const ziel = e.target.closest("[data-ziehkp]");
    if (!ziel){ gezogen = null; return; }
    e.preventDefault();
    const folge = [...prozessOrdnung()];
    const von = folge.indexOf(gezogen.id), nach = folge.indexOf(ziel.dataset.ziehkp);
    if (von !== -1 && nach !== -1 && von !== nach){
      folge.splice(nach, 0, folge.splice(von, 1)[0]);
      Z.prozessfolge = folge;
      Z.reihenfolge = folge.flatMap(kp => potenzialeVon(kp).map(x => x.potenzial_id));
      Z.geaendert = true;
    }
  }
  gezogen = null;
  zeichne();
});

document.addEventListener("dragend", () => {
  gezogen = null;
  document.querySelectorAll(".ziehziel").forEach(x => x.classList.remove("ziehziel"));
});

// Auf- und Zuklappen merken, damit ein Neuzeichnen es nicht zurücksetzt.
document.addEventListener("toggle", e => {
  const block = e.target.closest("[data-kp-block]");
  if (!block) return;
  const kp = block.dataset.kpBlock;
  block.open ? Z.offen.add(kp) : Z.offen.delete(kp);
}, true);

// Ungespeichertes nicht stillschweigend verlieren.
window.addEventListener("beforeunload", e => {
  if (Z.geaendert){ e.preventDefault(); e.returnValue = ""; }
});

// ===========================================================================
// Start
// ===========================================================================

async function starten(){
  if (!schluessel) return zeigeTor("");

  const zustand = await ruf("/api/oberflaeche/zustand");
  if (zustand.status === 401) return zeigeTor("Der Schlüssel stimmt nicht.");
  if (!zustand.ok){
    Z.meldung = {art: "warn", text: `Der Dienst antwortet nicht (${zustand.status}).`};
    return zeichne();
  }
  Z.fluechtig = !!zustand.rumpf.fluechtig;

  if (!await ladeListe()) return;
  await ladeLauf(document.getElementById("laufwahl").value);
}

starten();
</script>

</html>
