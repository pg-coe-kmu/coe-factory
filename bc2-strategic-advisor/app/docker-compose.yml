services:
  app:
    build: .
    restart: unless-stopped
    environment:
      # Gemeinsame PostgreSQL bei Supabase, Session-Pooler Port 5432.
      # Der Transaction-Pooler auf 6543 haelt keine Sitzung ueber die Anweisung
      # hinaus (BC2/CLAUDE.md).
      - DATABASE_URL=${DATABASE_URL:?DATABASE_URL fehlt}
      # Der Schluessel, den BC2 an BC0 ausstellt. Ohne ihn startet der Dienst
      # nicht — das ist Absicht, siehe app.py:lebenszyklus.
      - BC2_TRIGGER_TOKEN=${BC2_TRIGGER_TOKEN:?BC2_TRIGGER_TOKEN fehlt}
      # Die Messsaetze, aus denen die Oberflaeche ihre Laeufe rechnet, bis der
      # Bewertungsschritt angeschlossen ist (#288). Sie liegen ausserhalb von
      # app/ und damit ausserhalb des Bau-Kontexts — ohne diese Einhaengung
      # zeigte die Oberflaeche im Container keinen einzigen Lauf (#290).
      - BC2_MESSSAETZE=/kalibrierung
      # Der echte Weg (#288): `pakete` schaltet Erkennung, Bewertung und
      # Ausarbeitung ueber das Modell ein; leer bleibt es beim Messsatz. Beides
      # kam bis #306 gar nicht im Container an — die .env allein reicht nicht,
      # was hier nicht steht, sieht die Anwendung nicht.
      - BC2_LAUFQUELLE=${BC2_LAUFQUELLE:-}
      # Nur fuer den echten Weg. Liegt ausschliesslich in der Server-.env (ADR-003).
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
    volumes:
      - ../kalibrierung:/kalibrierung:ro
    expose:
      - "8000"

  # Die Vorschau unter https://<domain>/vorschau/ — Messsatz im Arbeitsspeicher,
  # zum Ausprobieren ohne Folgen. Derselbe Bau wie `app`, aber OHNE jedes
  # Geheimnis: keine DATABASE_URL, kein Modellschluessel (vorschau.py streicht
  # sie zusaetzlich). Ihr Schluessel ist ein eigener, kein BC2_TRIGGER_TOKEN.
  vorschau:
    build: .
    restart: unless-stopped
    command: ["python", "vorschau.py", "--host", "0.0.0.0", "--port", "8243",
              "--messsaetze", "/kalibrierung",
              "--schluessel", "${BC2_VORSCHAU_SCHLUESSEL:-vorschau}"]
    volumes:
      - ../kalibrierung:/kalibrierung:ro
    expose:
      - "8243"

  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      # Ohne Domain: ":80" (reines HTTP, nur zum Testen).
      # Mit Domain: "bc2.02da.de" -> automatisches Let's-Encrypt-HTTPS.
      - DOMAIN=${DOMAIN:-:80}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app
      - vorschau

volumes:
  caddy_data:
  caddy_config:
