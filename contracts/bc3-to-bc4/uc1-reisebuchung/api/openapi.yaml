components:
  schemas:
    CarProviderSucheAntwort:
      type: object
      description: Umschlag der Suchantwort. Aus io/CarResponse.java.
      properties:
        timestamp:
          type: string
          format: date-time
        totalCount:
          type: integer
          description: Anzahl der Treffer.
        providers:
          type: array
          items:
            "$ref": "#/components/schemas/CarProvider"
    CarProvider:
      type: object
      description: >-
        Datenmodell von BC4. Verbindlich ist model/CarProvider.java im Repository
        pg-coe-kmu/travel-mock-api; BC3 baut es hier nicht nach.
      additionalProperties: true
    FlightSucheAntwort:
      type: object
      description: Umschlag der Suchantwort. Aus io/FlightResponse.java.
      properties:
        timestamp:
          type: string
          format: date-time
        totalCount:
          type: integer
          description: Anzahl der Treffer.
        flights:
          type: array
          items:
            "$ref": "#/components/schemas/Flight"
    Flight:
      type: object
      description: >-
        Datenmodell von BC4. Verbindlich ist model/Flight.java im Repository
        pg-coe-kmu/travel-mock-api; BC3 baut es hier nicht nach.
      additionalProperties: true
    HotelSucheAntwort:
      type: object
      description: Umschlag der Suchantwort. Aus io/HotelResponse.java.
      properties:
        timestamp:
          type: string
          format: date-time
        totalCount:
          type: integer
          description: Anzahl der Treffer.
        hotels:
          type: array
          items:
            "$ref": "#/components/schemas/Hotel"
    Hotel:
      type: object
      description: >-
        Datenmodell von BC4. Verbindlich ist model/Hotel.java im Repository
        pg-coe-kmu/travel-mock-api; BC3 baut es hier nicht nach.
      additionalProperties: true
    Buchungswunsch:
      type: object
      description: >-
        Was BC3 beim Buchen mitgeben kann. Alle Angaben stammen aus dem eigenen Vorgang, nichts
        davon muss BC4 erst nachschlagen.
      required:
        - angebotId
        - vorgangId
        - freigegebenVon
        - freigegebenAm
      properties:
        angebotId:
          type: string
          description: Kennung des Treffers aus der Suche.
        vorgangId:
          type: string
          description: Kennung unseres Vorgangs, für die Zuordnung.
        reisende:
          type: array
          description: Nur so viele Angaben wie für die Buchung nötig.
          items:
            type: object
            properties:
              name:
                type: string
              geburtsdatum:
                type: string
                format: date
        freigegebenVon:
          type: string
          description: "Wer freigegeben hat. Pflicht: ohne menschliche Freigabe wird nicht gebucht."
        freigegebenAm:
          type: string
          format: date-time
    Buchung:
      type: object
      properties:
        buchungId:
          type: string
        status:
          type: string
          enum:
            - bestätigt
            - wartet
            - abgelehnt
            - storniert
        angebotId:
          type: string
        vorgangId:
          type: string
        belegnummer:
          type: string
          description: Nummer des Anbieters, falls vorhanden.
        erstelltAm:
          type: string
          format: date-time
