# Erzeugt von BC3-60. Nicht von Hand ändern - der naechste Lauf ueberschreibt es.
openapi: "3.0.3"
info:
  title: Reise-Schnittstelle BC4 - Bedarf aus KP-06
  version: 0.1.0-2026-09-06
  description: |-
    Von BC3 erzeugt, nicht von Hand geschrieben.

    Endpunkte mit `x-bc3-stand: vorhanden` stehen so in `pg-coe-kmu/travel-mock-api`, Zweig `master`; Pfade und Parameter sind Feld für Feld aus dem Java-Quelltext gelesen. Endpunkte mit `x-bc3-stand: vorschlag` fehlen dort und werden von den Tickets gebraucht - sie sind ein Vorschlag von BC3, kein Beschluss.

    BC3 beschreibt die Anfrage-Seite. Die Gestalt der Antworten gehört BC4: die Java-Modelle im Repository sind verbindlich, die Schemata hier verweisen darauf und lassen weitere Felder ausdrücklich zu.

    Stand 2026-09-06. Deckung 33% - 3 vorhandene, 6 vorgeschlagene Operationen.
servers:
  - url: https://travel-mock-api.onrender.com
    description: Von BC4 bereitgestellt.
tags:
  - name: cars
  - name: flights
  - name: hotels
paths:
