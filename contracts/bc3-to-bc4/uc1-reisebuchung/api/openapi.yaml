          in: query
          required: false
          schema:
            type: string
        - name: providerName
          in: query
          required: false
          schema:
            type: string
        - name: minRating
          in: query
          required: false
          schema:
            type: number
        - name: driverAge
          in: query
          required: false
          schema:
            type: integer
        - name: vehicleClass
          in: query
          required: false
          schema:
            type: string
        - name: categoryCode
          in: query
          required: false
          schema:
            type: string
        - name: brand
          in: query
          required: false
          schema:
            type: string
        - name: model
          in: query
          required: false
          schema:
            type: string
        - name: transmission
          in: query
          required: false
          schema:
            type: string
        - name: fuelType
          in: query
          required: false
          schema:
            type: string
        - name: driveType
          in: query
          required: false
          schema:
            type: string
        - name: airCondition
          in: query
          required: false
          schema:
            type: boolean
        - name: seats
          in: query
          required: false
          schema:
            type: integer
        - name: doors
          in: query
          required: false
          schema:
            type: integer
        - name: largeBags
          in: query
          required: false
          schema:
            type: integer
        - name: smallBags
          in: query
          required: false
          schema:
            type: integer
        - name: minPrice
          in: query
          required: false
          schema:
            type: number
        - name: maxPrice
          in: query
          required: false
          schema:
            type: number
        - name: freeCancellation
          in: query
          required: false
          schema:
            type: boolean
        - name: includedServices
          in: query
          required: false
          schema:
