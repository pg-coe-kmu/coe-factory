          description: Eine Pflichtangabe fehlt oder ein Wert ist unzulaessig.
  "/api/flights/search":
    get:
      summary: Flüge suchen
      description: Liest verfügbare Flüge. Vorhanden in pg-coe-kmu/travel-mock-api, Zweig master.
      operationId: get_flights_search
      tags:
        - flights
      x-bc3-stand: vorhanden
      x-bc3-quelle: src/main/java/com/coe/b04/server/controller/FlightController.java
      parameters:
        - name: origin
          in: query
          required: true
          schema:
            type: string
        - name: originIataCode
          in: query
          required: false
          schema:
            type: string
        - name: destination
          in: query
          required: true
          schema:
            type: string
        - name: destinationIataCode
          in: query
          required: false
          schema:
            type: string
        - name: departureDate
          in: query
          required: false
          schema:
            type: string
            format: date
          description: Format yyyy-MM-dd.
        - name: departureDateFrom
          in: query
          required: false
          schema:
            type: string
            format: date
          description: Format yyyy-MM-dd.
        - name: departureDateTo
          in: query
          required: false
          schema:
            type: string
            format: date
          description: Format yyyy-MM-dd.
        - name: numberOfAdults
          in: query
          required: false
          schema:
            type: integer
        - name: numberOfChildren
          in: query
          required: false
          schema:
            type: integer
        - name: numberOfInfants
          in: query
          required: false
          schema:
            type: integer
        - name: travelClass
          in: query
          required: false
          schema:
            type: string
            enum:
              - Economy
              - Premium Economy
              - Business
              - First
            x-bc3-java-typ: TravelClass
            description: >-
              Nach aussen gilt der Anzeigename. Die Konstanten ECONOMY, PREMIUM_ECONOMY, BUSINESS, FIRST
              werden ebenfalls angenommen.
        - name: maxPrice
          in: query
          required: false
          schema:
            type: number
      responses:
        "200":
          description: Treffer, möglicherweise eine leere Liste.
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/FlightSucheAntwort"
        "400":
          description: Eine Pflichtangabe fehlt oder ein Wert ist unzulaessig.
