  "/api/flights/bookings":
    post:
      summary: Buchung anlegen - Flüge
      description: >-
        **Fehlt in pg-coe-kmu/travel-mock-api.** Buchung anlegen. Gebraucht für "Reiseanfrage
        automatisch erfassen und Verfügbarkeit prüfen". Vorschlag von BC3, kein Beschluss - Methode
        und Pfad sind verhandelbar, der Bedarf nicht.
      operationId: booking_flights
      tags:
        - flights
      x-bc3-stand: vorschlag
      x-bc3-bedarf: flights/booking
      responses:
        "201":
          description: Angelegt.
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/Buchung"
        "400":
          description: Eine Pflichtangabe fehlt oder ein Wert ist unzulaessig.
        "409":
          description: Das Angebot ist nicht mehr verfuegbar.
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              "$ref": "#/components/schemas/Buchungswunsch"
