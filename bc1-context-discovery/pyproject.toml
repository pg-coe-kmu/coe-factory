[project]
name = "bc1-core"
version = "0.1.0"
requires-python = ">=3.11"

[dependency-groups]
dev = [
    "pytest",
    "httpx",
    "httpx2",
    "tdd-guard-pytest>=0.1.2",
    "jsonschema",
]
service = [
    "fastapi",
    "uvicorn[standard]",
    "psycopg[binary,pool]",
    "anthropic",
    "httpx",
    "google-genai",
    "ollama",
]

# `uv sync` ohne Zusatz richtet beide Gruppen ein (Tests brauchen den Dienst);
# das Image nimmt mit `--no-dev --group service` nur die Dienst-Gruppe.
[tool.uv]
default-groups = ["dev", "service"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
